<section class="mast"><div><div class="kicker">Listening practice</div><h1>先听结构，再抓答案</h1><p class="lead">先不看题听一遍，记下 lecture map。第二遍按题型定位：比较选项、预测答案类别、听完整证据，再检查答案。</p></div><aside class="routine"><strong>每段音频</strong><ol><li>第一遍：只记主题和结构</li><li>用笔记尝试作答</li><li>第二遍：补漏并检查</li><li>最后完成 Summary / Evaluation</li></ol></aside></section>

<script>
const DATA={"topics": [{"id": "t1", "number": 1, "title": "Urban Populations and Transport", "audio": "audio/1. Urban Populations and Transport.mp3", "transcript": "TOPIC 1: URBAN POPULATIONS AND TRANSPORT\n\n[00:00]\nGood morning. In this lecture, I'd like to discuss a problem caused by increasing urban populations, and that problem is transport, meaning how to move increasing numbers of people from A to B efficiently. I'm going to start today by looking at London and what it has done to tackle this problem. Then I'll describe what the Dutch have done, using examples from the city of Groningen. Finally, I'd like to suggest that London and other UK cities could learn a lot from the Dutch example.\n\nFirstly, then, let's discuss London. The population size of our capital city has been increasing quickly in the last twenty to thirty years. The population now stands at roughly 8,600,000. That means there are nearly 5,500 people per square kilometre.\n\n[01:00]\nCompare that to Paris at 21,500 and Manila in the Philippines at about 43,000. So, compared with many cities, London is not so densely populated. The population only refers to the people living there. Thousands more people travel into London from outside the city on workdays. For example, 175,000 people live in the London borough of Westminster, but the number of people actually in Westminster rises to 645,000 on working days. That's an increase of over 250%.\n\nThis growing population of people who live in cities and, more to the point, those who work in cities means commuters need to get around the city easily. Good transport is essential.\n\n[02:00]\nThe Westminster district of London doesn't have a great deal of housing stock, but it does have a huge number of offices, hence the massive increase in the number of people during the working day compared with the evening and weekends. The question is then: how do all these people move around the city to do their jobs and their business?\n\nLondon is, of course, iconic for its two-floor buses, usually called double-decker buses. It is also famous for its black cabs and its Underground train system. In order to keep increasing numbers of people moving quickly and freely around the city, London invests heavily in transport infrastructure. The Underground, for example, is constantly being upgraded, including with new lines. The newest one of these is the Jubilee line, which came into service in 1979, but it has been extended since.\n\n[03:00]\nThe Piccadilly line has also recently been extended to run to the new airport terminal at Heathrow, Terminal 5. The latest example of London responding to the transport needs of its citizens and commuters is called Crossrail. This is a new railway line running east to west across London and beyond. It includes 26 miles, or 42 kilometres, of underground train line. The tunnel is up to 40 metres below the ground in some places. This really is quite an amazing feat of engineering, I'm sure you'll agree.\n\nIt has, however, become apparent to transport planners that projects such as Crossrail will not solve the long-term need for transport in and around London. It is a solution for the short term only, so similar-sized projects would need to be completed every few years to keep up with the increase in demand.\n\n[04:00]\nYou will notice here that the improvements to London's transport have focused on public transport and not on building roads for cars. There is a lot of investment in roads, but this money is mainly invested in roads that link cities together rather than roads within cities.\n\nIn fact, to reduce the number of cars in the centre of the city, London was an early adopter of the congestion-charge idea. In 2003, it introduced the congestion charge, meaning that cars travelling into central London paid a charge for doing so. This resulted in a 10% drop in the number of cars entering the city, which in turn improved the quality of the air and made the roads slightly less busy.\n\n[05:00]\nTo conclude this part of the talk about London's growing transport problems caused by population increases, we can say that, although London is being proactive in developing its transport infrastructure, it is barely doing enough to meet demand. This means that residents and commuters will continue to struggle in the coming years.\n\nLet's now turn to a country that has taken a completely different view of the transport problems faced by every town and city around the world. The Netherlands is just across the North Sea, to the east of the UK. In the 1970s, it faced the same issues as London and the UK did: rising numbers of cars on the roads, causing increased congestion and an increasing number of road accidents. The problem came to a head when residents started to demonstrate about the high number of children being killed on the roads. Instead of building more roads for cars to use, the state did something completely different.\n\n[06:00]\nI'll explain through an example. Groningen is a city in the Netherlands with a population of about 200,000 people, so it is a little smaller than, say, Leicester and much smaller than London. You might argue that comparing such a small city with such a large one is unfair, but the principle is the same whether you have a population of 200,000 or two million.\n\nIn the 1970s, instead of building new roads to accommodate increasing traffic, the mayor of Groningen stopped traffic from travelling through the city from one end to the other. Traffic was routed instead around the city. This meant that the roads through the centre were less congested and therefore safer for pedestrians and bicycles.\n\n[07:00]\nAt this point, you might argue that a city like London is just too big to walk or cycle through. It might be if you live on the edges of London, but the central area is surprisingly easy to move around by bike, hence the success of the so-called Boris Bikes. These are bikes that you can hire for an hour or two to get around London. They are named after Boris Johnson, the mayor of London at the time. In many cases, these Boris Bikes are quicker than using the Underground where, as you may know, you spend a long time getting to and from the train platforms at stations.\n\nAlthough the idea in Groningen was initially met with resistance, it was soon accepted. Travelling by bicycle was quicker than travelling by car. With changes to roads, including the creation of many one-way streets, it became difficult and time-consuming to use a car to travel in the city. Now, 61% of all journeys around the city are made by bike.\n\n[08:00]\nThe results for people's health are fairly obvious. Less air pollution means fewer respiratory illnesses, and the extra physical activity means the population of Groningen are very healthy compared with their UK counterparts. Surprisingly, perhaps, the move away from car-centric travel has also had a positive impact on the economy. Shop owners were originally against the idea, fearing that they would lose trade, but actually the reverse happened and they have had an increase in trade.\n\nThis move, made more than thirty years ago, has created a sustainable way for the citizens of Groningen to travel around the city. The same can be said of other cities in the Netherlands, for example Utrecht and the capital, Amsterdam, where over 30% of all journeys are made by bike.\n\n[09:00]\nCompare this with London, where only about 3% of journeys to and from work are by bike, and you'll see quite a difference. Despite some changes to the roads in London to make cycling safer and easier, many people find it too dangerous to use their bike.\n\nWhat London and other UK cities need to do is deter people from driving to and from work by making their journeys longer through changing road layouts and reducing the number of parking spaces available to drivers. That, together with better cycling infrastructure, might persuade more people to ride their bike to work, thus creating a healthier and happier society. The Dutch model does work, but it requires great political will to make it work.\n\n[10:00]\nTo summarise, then, London and many other UK cities are struggling to provide enough transport infrastructure to allow residents and commuters to travel in and out of the city. Dutch cities have redesigned their transport around the environmentally friendly bicycle, a sustainable form of transport. London and other UK cities could follow the Dutch model if politicians are willing.\n\nOkay, ladies and gentlemen, that's it for today. Thank you very much indeed.", "questions": [{"q": "Q1", "type": "Sequencing", "original": "1. In his introduction, the speaker outlines 3 parts to his talk. Put them in the correct order by writing 1–3 in the space provided. One option will not be needed.\n\na) What London could do to address transport problems. ___\nb) What Dutch cities have done to address transport problems. ___\nc) What London has done to make the transport problem worse. ___\nd) What London has done to address transport problems. ___", "highlight_kind": "difference", "highlights": ["Dutch cities", "worse"]}, {"q": "Q2", "type": "Note completion", "original": "2. The speaker gives some statistics about the size of London compared to other cities. Complete the table of information using no more than three words or a number.\n\nCity: London | Paris | (d) __________\n(a) __________: 8.6 million\n(b) Population __________: London 5,500 | Paris (c) __________ | 43,000", "highlight_kind": "theme", "highlights": ["size of London", "Population", "City"]}, {"q": "Q3", "type": "Note completion", "original": "3. Complete the data about the London borough of Westminster.\n\na) Population: __________\nb) Number of people during the day: __________\nc) Increase of over: __________", "highlight_kind": "theme", "highlights": ["Population", "during the day", "Increase"]}, {"q": "Q4", "type": "Short answer", "original": "4. Circle the correct word in bold and complete the sentence based on the information given.\n\nThe population of Westminster increases / decreases in the evening because… __________", "highlight_kind": "theme", "highlights": ["increases", "decreases", "in the evening"]}, {"q": "Q5", "type": "Note completion", "original": "5. In the lecture, the speaker describes 3 examples of new and improved public transport in London. Complete the notes using no more than three words or a number.\n\nThe newest underground line is called the (a) __________ line which came into service in (b) __________. The Piccadilly Line now runs to (c) __________ at Heathrow Airport. Cross-rail is a railway running across London, (d) __________ miles, or 42km of which is underground, and up to (e) __________ metres below the surface.", "highlight_kind": "theme", "highlights": ["new and improved public transport", "newest underground line", "Heathrow Airport", "Cross-rail"]}, {"q": "Q6", "type": "Multiple choice", "original": "6. Why do transport planners believe projects like Cross-rail will not solve London’s transport problem?\n\na) The Cross-rail project was not completed in time.\nb) London cannot develop projects quickly enough.\nc) Cross-rail will need to be replaced within a few years.\nd) Commuters do not like to use Cross-rail.", "highlight_kind": "difference", "highlights": ["not completed in time", "quickly enough", "replaced within a few years", "do not like"]}, {"q": "Q7", "type": "Multiple choice", "original": "7. The speaker mentions the building of roads. What does he say?\n\na) New roads are not built nowadays.\nb) New roads are usually built between cities.\nc) New roads are built where there is space available in cities.\nd) New roads are very expensive to build.", "highlight_kind": "difference", "highlights": ["not built nowadays", "between cities", "space available in cities", "expensive"]}, {"q": "Q8", "type": "Multiple choice", "original": "8. The speaker outlines the results of the congestion charge. Which one of the following is not correct?\n\nThe congestion charge led to…\na) no traffic jams.\nb) less air pollution.\nc) less busy roads.\nd) fewer cars.", "highlight_kind": "difference", "highlights": ["not correct", "no traffic jams", "air pollution", "busy roads", "fewer cars"]}, {"q": "Q9", "type": "Multiple choice", "original": "9. What caused the Dutch authorities to tackle the transport problem in the Netherlands?\n\na) Protests about the deaths of children in road accidents.\nb) Lack of money to build more roads.\nc) Predicting future problems by looking at London.\nd) More residents moving to the cities.", "highlight_kind": "difference", "highlights": ["deaths of children", "Lack of money", "future problems", "residents moving"]}, {"q": "Q10", "type": "Summary cloze", "original": "10. Using no more than three words from the lecture in each gap, complete the following summary of the speaker’s comments about Groningen.\n\nThe speaker acknowledges that Groningen is (a) __________ than London, but claims the comparison is fair because (b) __________ is the same, regardless of population size. In Groningen in the 1970s, the mayor decided to make traffic travel (c) __________. The result was less congestion on the roads and safer conditions for (d) __________ and __________.", "highlight_kind": "theme", "highlights": ["than London", "comparison is fair", "traffic travel", "safer conditions"]}, {"q": "Q11", "type": "Multiple choice", "original": "11. The speaker suggests Boris Bikes are popular because…\n\na) they are cheaper than the underground.\nb) they are faster than the underground.\nc) the underground doesn’t reach the outskirts of London.\nd) the underground can be unsafe.", "highlight_kind": "difference", "highlights": ["cheaper", "faster", "outskirts", "unsafe"]}, {"q": "Q12", "type": "Note completion", "original": "12. The speaker notes the positive effect the changes in Groningen had on health. Complete the notes using no more than three words.\n\nCause: Less air pollution → Effect: (a) __________\nCause: (b) __________ → Effect: Dutch are healthier than people in the UK.", "highlight_kind": "theme", "highlights": ["positive effect", "health", "Cause", "Effect"]}, {"q": "Part 3", "type": "Summary / Evaluation", "original": "Summary and Evaluation Task\n\nSummarise: The ways in which UK cities can encourage more people to cycle.\nEvaluate: Do you think the suggestions would be successful in cities around the world?", "highlight_kind": "theme", "highlights": ["encourage more people to cycle", "successful", "around the world"]}]}, {"id": "t2", "number": 2, "title": "Food Miles", "audio": "audio/2. Food Miles Audio.mp3", "transcript": "TOPIC 2: FOOD MILES\n\n[00:00]\nHello. Today I'd like to talk to you about something called food miles. One result of globalisation is that our diet has become much more varied because we now have access to food from all over the world. Food that was once considered exotic, like avocados, is now fairly commonplace in your local supermarket. In fact, it was not so long ago, before you were born but not before I was born, that the food we bought in the UK was quite seasonal. Certain foods were only available at certain times of the year, depending on what was grown and harvested locally. As I said, that has now changed. Walk into any supermarket or market and it is possible to buy pretty much any food that you like.\n\n[01:00]\nThis availability led to a new term called food miles. It was coined by Professor Tim Lang in a report called The Food Miles Report: The Dangers of Long-Distance Food Transport, which was published in 1994. It is this concept that I'd like to discuss today, as it is one which spurred the growth of a new industry, but is also the subject of some debate regarding climate change and pollution caused by transporting food all over the world.\n\nFirstly, I will define this food-miles concept. Then I will look into its effects, both positive and negative. Lastly, I will consider the two sides of the debate on whether or not we, as consumers, should be careful about our food miles. So, what are food miles?\n\n[02:00]\nBasically, the term refers to the distance that any food travels from producer to consumer. For example, bananas usually originate from countries in Latin America such as Costa Rica and Ecuador. Lamb is often imported from New Zealand. In fact, that is a strong collocation: New Zealand lamb. Other strong associations are Danish bacon, French wine, Italian olive oil, Chinese tea and Colombian coffee beans. As you can see, some foods are strongly associated with certain countries.\n\nMost of these are usual products that we can buy all year round because they are not perishable, meaning that they last a long time. Other products, though, especially fruit, are perishable and therefore need to be transported quickly to their destination after being harvested and packaged.\n\n[03:00]\nIf you walk around your local supermarket in the summer, you will see strawberries grown and picked in the UK. There may also be strawberries picked and grown outside the UK. Oddly, the imported strawberries from perhaps Spain or Morocco are often cheaper than the UK-grown ones, even though they have extra transport costs associated with them. So, food miles is the distance any food travels between producer and consumer.\n\nLet's now look at the effects, both positive and negative. There are, I think, two positives. Firstly, choice. Consumers nowadays want choice, and imported food gives us a year-round choice of foods. Secondly, health. The fact that many different fruits and vegetables are available all year round is good for our health.\n\n[04:00]\nIt allows us to have a balanced diet. The negatives were first discussed in the publication I mentioned earlier, The Food Miles Report: The Dangers of Long-Distance Food Transport, which was published in 1994. There are two main disadvantages. The first is, as you might have guessed, the environmental problem, in that a lot of carbon dioxide, or CO2, is produced when transporting all of this food from country to country.\n\nThe second problem is more complex. As supermarkets have more choice in where to source their food from, they have the ability to squeeze prices. Perhaps I should explain by way of an example. Let's take strawberries. Some years ago, strawberries sold in the summer in the UK were grown in Britain.\n\n[05:00]\nThen supermarket giants like Tesco realised that the consumer could enjoy the taste of summer all year round if they imported strawberries from southern Europe and North Africa. The supermarkets then realised it was actually cheaper to buy strawberries from southern Europe and North Africa all year round. The consumer then had a choice in summer: buy British for a higher price or buy the imported ones at a cheaper price.\n\nThe next effect is that supermarkets give themselves more buying leverage. If they guarantee to buy a certain amount of strawberries each year, they can negotiate the price of those strawberries down. This generally leads to lower profits for the producer. That is a very simplified picture of the problem.\n\n[06:00]\nYou can see the same issues with milk in the UK. Farmers are forced to sell milk at more or less what it costs them to produce because of the purchasing power of the supermarkets. If it is a problem in the UK, think how much worse it can be in a developing country. Powerful supermarkets can bankrupt suppliers in developing countries if they suddenly stop buying from them. That threat continues to drive down prices.\n\nOne interesting result of this price squeezing was a movement called Fair Trade. You see this on coffee, tea and similar goods. Basically, it means that the coffee you buy has been produced to minimum economic, social and environmental standards to ensure the long-term success of the farmers. However, Fair Trade has been criticised.\n\n[07:00]\nIf a manufacturer buys 20% of its beans from Fair Trade farms, then it can label 20% of its products as such. Thus, the Nescafé coffee that you buy from Nestlé might not necessarily be made with Fair Trade coffee beans, but you know that Nestlé does make some of its coffee with Fair Trade beans.\n\nI digress a little. Let's get back to the food-miles issue. As I said, in order to provide a wide range of foods, particularly fruit, at competitive prices, supermarkets buy from overseas. Much of this food has to be transported by air to make the producer-to-consumer time gap short. Air travel produces a lot of CO2 and this is harmful to the environment. It also means that, although producers are selling, their profit is low, which is not good for them.\n\n[08:00]\nLet's now look at solutions to the environmental problem of transporting food long distances. The first was a marketing coup for the supermarkets. They started to label food as grown in the UK. Consumers, feeling a little bit patriotic, would not mind spending a little more to buy a product grown on home soil.\n\nThe second solution, well, it isn't actually a solution. It is in fact another way of looking at the issue of environmental damage caused by agriculture and transporting food. Let's take New Zealand as an example. Much of the food grown in New Zealand is grown for export. As New Zealand is on the other side of the world, you would expect products from there to have a high environmental impact, that is, lots of CO2 emissions because of transport.\n\n[09:00]\nHowever, a paper by Lincoln University in New Zealand suggests that this is not actually the case. Three examples of typical food, milk, lamb and apples, will explain. According to researchers from Lincoln University, the UK uses twice as much energy per tonne of milk solids produced as New Zealand. The energy used in producing lamb in the UK is four times higher than the energy used by New Zealand lamb producers, even after including the energy used in transporting New Zealand lamb to the UK. New Zealand CO2 emissions are also considerably lower than those in the UK. And a final example: New Zealand is also more efficient in producing and delivering apples to the UK market than the UK is.\n\n[10:00]\nNew Zealand energy costs for production are a third of those in the UK. Even when transport is added, New Zealand energy costs are approximately 60% of those in the UK. Now, you might question the reliability of the source, but the paper is over 100 pages long and there are many statistics to support its claims. Very briefly, in the UK, farmers spend more money on fertilisers and chemicals and on additional food for sheep and cows, whereas in New Zealand the animals can eat fresh grass all year round.\n\nTo conclude, the concept of food miles gained much currency in the late 1990s and is still debated today. It is clearly a source of CO2 emissions, but perhaps not as much as we might think. In fact, importing food might even reduce CO2 consumption because some countries, such as New Zealand, can actually produce food with lower pollution levels than the home country can.", "questions": [{"q": "Q1", "type": "Note completion", "original": "1.   Complete the paraphrase of the speaker’s introduction, using no more than ONE word or a\n     number from the lecture in each gap.\n\n     People’s diets today have become much more varied, due partly to (a) ____________________.\n     In the past, food in the UK was fairly (b) ___________________; some food was only available\n     at certain times of the year, depending on the local area. Today, food from around the world is\n     freely available. The term ‘food miles’ originates from a report titled ‘The Food Miles Report: The\n     (c) ________________ of long-distance Food Transport’, published in (d) ______________.", "highlight_kind": "theme", "highlights": ["diets today", "In the past", "Food Miles Report", "published"]}, {"q": "Q2", "type": "Sequencing", "original": "2.   Complete the structure of the talk by writing 1 – 3 in the correct place. One option is not\n     needed.\n\n     a) The speaker’s view on food miles.____\n     b) The difficulty of measuring food miles. ____\n     c) A definition of ‘food miles’. ____\n     d) The benefits and drawbacks of food miles. ____", "highlight_kind": "difference", "highlights": ["speaker’s view", "difficulty of measuring", "definition", "benefits and drawbacks"]}, {"q": "Q3", "type": "Multiple matching", "original": "3.   The speaker discusses the origin of a number of foods. Complete the notes based on the\n     information given.\n\n Product                                               Country\n Bananas                                               Costa Rica & (a) _________________________\n\n b) ______________________________                     New Zealand\n\n Bacon                                                 c) _____________________________________\n\n Wine                                                    France\n\n Olive oil                                               Italy\n\n Tea                                                     China\n\n Coffee beans                                            d) _____________________________________", "highlight_kind": "difference", "highlights": ["food", "country"]}, {"q": "Q4", "type": "Multiple choice", "original": "4.     What must producers do to minimise the impact of perishable food?\n\n       a) Harvest the product quickly.\n       b) Sell the product quickly.\n       c) Transport the product quickly.\n       d) Freeze the product quickly.", "highlight_kind": "difference", "highlights": ["Harvest", "Sell", "Transport", "Freeze"]}, {"q": "Q5", "type": "Multiple choice", "original": "5.     The speaker discusses strawberries in UK supermarkets. Which one of the following is true?\n\n       a) Fruit from overseas is better quality than British fruit.\n       b) Only fruit from European countries can be sold in UK supermarkets.\n       c) Fruit from overseas is often lower cost than British.\n       d) UK supermarkets prefer to sell fruit from overseas.", "highlight_kind": "difference", "highlights": ["better quality", "European countries", "lower cost", "prefer"]}, {"q": "Q6", "type": "Short answer", "original": "6.     The speaker notes two positive effects of food miles on consumers. List them.\n\n       a) ___________________________________________________________________________\n\n       b) ___________________________________________________________________________", "highlight_kind": "theme", "highlights": ["two positive effects", "consumers"]}, {"q": "Q7", "type": "Summary cloze", "original": "7.     Complete the summary of the speaker’s comments on the problems associated with food miles\n       using no more than five words from the lecture.\n\n       Along with the environmental concerns related to food miles, a second problem is associated\n       with cost. Since supermarkets are able to choose where they source their food, they are able to\n       (a) ______________________. The decision by supermarkets like Tesco to import fruits from\n       Europe and North Africa means consumers can (b) ________________________\n\n     _______________________ year-round. It also means that supermarkets have\n     (c) ____________________________ with the suppliers: if they agree to buy a fixed amount\n     year round, they can negotiate the price. This results in (d) _______________________ for the\n     producer.", "highlight_kind": "theme", "highlights": ["environmental concerns", "cost", "supermarkets", "producer"]}, {"q": "Q8", "type": "Multiple choice", "original": "8.   Why has Fair Trade been criticised, according to the speaker?\n\n     a) Food companies only need to buy 20% of their food from Fair Trade suppliers for it to be\n     classed as Fair Trade.\n\n     b) It is difficult for food companies to buy 20% of their food from Fair Trade suppliers.\n     c) Food prices increase by 20% when the food is supplied by Fair Trade suppliers.\n     d) Many food companies label their food as fair trade when actually none of it is fair trade.", "highlight_kind": "difference", "highlights": ["only need to buy", "difficult", "prices increase", "none of it"]}, {"q": "Q9", "type": "Note completion", "original": "9.   The speaker introduces two approaches to the problem of food miles. Complete the notes\n     based on the first solution.\n\n     Approach 1: Labelling food as _____________________________________________________\n\n     Result: _______________________________________________________________________", "highlight_kind": "theme", "highlights": ["two approaches", "food miles", "Labelling", "Result"]}, {"q": "Q10", "type": "Multiple matching", "original": "10. Choose the correct answer from the box below to complete the notes. Three options are not\n    needed.\n\n      double the                three times as much     half as much              four times as much\n      a third of the            60% more                16% more                  six times more\n\n      New Zealand vs UK products: milk, lamb and apples\n\n      UK uses (a) __________________________ energy than New Zealand in milk production.\n\n      UK uses (b)___________________________ energy in producing lamb.\n\n      NZ uses (c)___________________________ energy in producing apples compared to the UK.", "highlight_kind": "difference", "highlights": ["UK", "New Zealand", "milk", "lamb", "apples"]}, {"q": "Q11", "type": "Short answer", "original": "11. The speaker notes two reasons why he believes the report is reliable. What are they?\n\na) __________\nb) __________", "highlight_kind": "theme", "highlights": ["two reasons", "report", "reliable"]}, {"q": "Q12", "type": "Multiple choice", "original": "12. According to his conclusion, how does the speaker feel about food miles?\n\na) It is a big problem particularly for the UK.\nb) It is not a problem.\nc) The problem is overstated.\nd) It is no longer debated today.", "highlight_kind": "difference", "highlights": ["big problem", "not a problem", "overstated", "no longer debated"]}, {"q": "Part 3", "type": "Summary / Evaluation", "original": "Summary and Evaluation Task\n\nSummarise: The arguments in favour of importing food from around the world.\nEvaluate: To what extent do you agree with the speaker’s point of view?", "highlight_kind": "theme", "highlights": ["arguments in favour", "importing food", "agree"]}]}, {"id": "t3", "number": 3, "title": "Teenagers and Sleep Deprivation", "audio": "audio/3. Teenagers and Sleep.mp3", "transcript": "TOPIC 3: TEENAGERS AND SLEEP DEPRIVATION\n\n[00:00]\nHello. Have you ever had the unpleasant feeling of not wanting to get out of bed? I think we've all wished, at one time or another, that we could just turn over and go back to sleep when we know we have to go to work, school or university, or another appointment. It is common knowledge that the people who have the most significant problems getting up are adolescents and young adults.\n\nUnfortunately, lack of sleep, or sleepiness, for 12 to 25-year-olds can have serious consequences for their education. It is this aspect of young people's sleep-associated problems that I want to focus on in the lecture. I'll first look at the leading causes of sleeping problems for young people, followed by a discussion of their major effects on academic development, and then I'll finish by showing you some possible solutions that researchers have put forward for schools and governments to tackle this issue.\n\n[01:00]\nSo why do many students have problems staying awake and focused at school, college or university? Why is it often a perpetual struggle for them to get up and get through a day's tuition with all the attention and energy that they used to have when they were children? Surely, we can't just blame teachers for boring lessons or boring subjects. There must be some other factor that leads some individuals to be so drowsy in class, assuming they even got out of bed in the morning.\n\nIn fact, there are several factors. The USA's National Sleep Foundation has identified two general groups of causes of sleepiness: physiological and behavioural or psychosocial. I'll next explain each of these two types of cause. Firstly, young people's physiology, the way their biological systems work, undergoes some key changes which affect their sleeping.\n\n[02:00]\nNot only do they require 8.5 to 9.25 hours of sleep every night, but even when this requirement is met, daytime sleepiness naturally rises. Another change, which is especially disruptive on school days, is that adolescents generally wake up later and go to sleep later, in what is called a phase delay. Wolfson and Carskadon found that secondary-school students' natural sleep times began at 11 p.m. or later. So, physiology clearly plays a major role in young people's changing sleep requirements.\n\nThe second group of causes of sleep issues concerns students' behaviour, psychology and social pressures. One such issue is lack of sleep, for example staying up late to watch films, surf the Internet or play games.\n\n[03:00]\nThese are all common behaviours among young people. Another example is late-night socialising, whether in person at parties or via social media such as Facebook and Twitter. Although all of these activities play important social and welfare roles in a young person's life, unfortunately they also contribute to one having insufficient amounts of sleep.\n\nIn a survey, again by Wolfson and Carskadon, only 15% of American adolescents reported sleeping 8.5 hours or more on a school night. In fact, 26% of them said they usually sleep less than 6.5 hours. As well as lack of sleep, the change in sleep patterns at weekends can cause problems. Wolfson and Carskadon's survey found that 18-year-olds had an average of two hours more sleep at weekends. The researchers noted that this discrepancy in sleep patterns can increase the phase delay I mentioned earlier and damage the quality of student sleep overall.\n\n[04:00]\nYoung people's habits, psychology and social activities have a negative impact on the quality, quantity and timing of their sleep. Now I'd like to move on to the impact that sleep-associated problems are having on young people's education. We've considered the many causes of these problems. Though the effects are comparatively few in number, that does not mean that these effects are minor. The main impact, low grades and poor school performance, is a significant one.\n\nNumerous studies, including those by Foster et al. in 2013, have shown a range of cognitive responses to the sleep issues discussed earlier in the lecture. These responses include poor concentration, poor attention, performance, memory formation and retrieving information from memory.\n\n[05:00]\nThese responses will undoubtedly affect some students' grades at school, college or university, though it is very difficult to prove this through direct empirical research and concrete evidence is currently limited. Nevertheless, one study by Curcio, Ferrara and De Gennaro has established a causal link between lack of sleep and poor levels of learning and achievement at school.\n\nOther problems arising from the issues surrounding sleep include negative emotions and behaviour. Anger, sadness and fear feature in many teenagers' lives, but limited or irregular sleep can make these emotions stronger or more frequent. Even more concerning, symptoms such as poor attention, inability to complete tasks and problems sitting still and focused have been observed in sleep-deprived young people.\n\n[06:00]\nSleep psychologist Dahl noted that these symptoms were very similar to those of ADHD, a disorder seen more and more frequently in schools and colleges. This has serious implications for teaching and learning. So, young people's problems with sleep clearly have negative impacts on their education.\n\nNow, the last point to consider is what can be done about this. What can governments and people in the teaching profession do to help solve this considerable problem? With students' future careers at stake, there is an obvious need for action. It may seem that there is little we can change about some causes, such as young people's changes in physiology or natural biological processes, and some teenagers will always want to stay up later and party.\n\n[07:00]\nWith the psychosocial and behavioural causes that we talked about earlier, however, there is a lot we can do to help the situation. After all, other cultures do not experience sleep-associated educational problems as much as Britain, the USA and other Western nations.\n\nThere are three main actions that could help students and teachers, according to the USA's National Sleep Foundation. Firstly, teachers need to be made more aware of the nature of the problem. With a greater understanding of the causes discussed in this lecture, supported by continued research into the subject, teachers and educators will be better at supporting and encouraging individual students who are having sleep-related difficulties. Secondly, all of this knowledge and understanding of the issues should not be restricted to educators. Students should be taught it.\n\n[08:00]\nIf governments allow sleep-related education to form part of the national curriculum, students will have an opportunity to understand the problems they may be experiencing, and this may be the first step towards finding a realistic solution.\n\nFinally, schools can become more sleep-friendly. Later starting times to accommodate students' natural phase delay are a real option. Some schools have already begun starting lessons later in the morning, and we are beginning to see evidence that these changes are having real effects on student alertness, positivity and, importantly, academic development and grades. Wahlstrom and Freeman at the University of Minnesota in the USA conducted studies in this area, reporting a positive relationship between later school start times and student progress. Of course, the possibility of schools opening later depends on governmental policy changes.\n\n[09:00]\nTherefore, legislation needs to change to encourage schools to start no earlier than 9 a.m. Further studies and greater public awareness will certainly help make these improvements a reality.\n\nIn conclusion, young people are having problems with lack of sleep, poor-quality sleep and delayed sleep cycles. These issues are due to biological or physiological changes associated with adolescence, as well as behavioural, psychological and social factors such as the desire for late-night socialising. Many students are therefore often very tired at school, college or university, leading to poor levels of learning, engagement and academic performance. The main ways in which we can address sleep-associated problems involve education and awareness-raising of the issue.\n\n[10:00]\nWith better understanding, teachers and students can come together and begin to work out solutions and means of support. Furthermore, governments and schools can work to encourage generally later start times to cater for physiological sleep needs.\n\nHowever, I would like to finish by saying that this last approach, schools starting later, brings certain risks. It may encourage some students to have even later nights during the week, leading to even greater sleep-related problems. This is especially true in Western youth culture, with online gaming, social media, the strong emphasis on socialising, and the idea of school being a boring necessity. Students may have much to learn from cultural exchanges with countries such as China, where young people's typical behaviour is significantly different and more education-focused.\n\n[11:00]\nSo, those are my final comments on the issue. Now I'd like you to share your thoughts on the matter.", "questions": [{"q": "Q1", "type": "Sequencing", "original": "1.   In the introduction the speaker outlines the structure of the talk. Put the following in the\n     correct order, one is not required.\n\n     a) How young people’s education can be affected by sleep-related problems. ______\n     b) Reasons why young people’s quality of sleep is worse than in the past. ______\n     c) Ways in which sleep-related problems might be solved in the future. ______\n     d) Reasons why 12 - 25-year-olds have problems with sleep. ______", "highlight_kind": "difference", "highlights": ["education", "quality of sleep", "solved in the future", "12 - 25-year-olds"]}, {"q": "Q2", "type": "Multiple choice", "original": "2.   Which one of the following is true, according to the speaker?\n\n     a) Daytime tiredness has been a problem for some since childhood.\n     b) Students get tired because lessons are not interesting.\n     c) Many teenagers regularly miss school due to illness.\n     d) Many students had more energy during their childhood.", "highlight_kind": "difference", "highlights": ["since childhood", "lessons are not interesting", "miss school", "more energy"]}, {"q": "Q3", "type": "Summary cloze", "original": "3.   The speaker discusses how young people’s sleep patterns are linked to their physiology.\n     Complete the following summary using one word or a number from the lecture for each gap.\n\n     Young people need between 8.5 and (a) ______________ hours’ sleep per night. However, this\n     does not stop their natural daytime (b) _______________ from increasing. Going to bed later\n     and getting up later also leads to a ‘phase (c) _______________’. Research shows that\n     adolescent sleep time generally starts after (d) _______________.", "highlight_kind": "theme", "highlights": ["physiology", "hours’ sleep", "daytime", "phase"]}, {"q": "Q4", "type": "Short answer", "original": "4.   The speaker lists common causes of sleep loss. Complete the list.\n\n     - watching films\n     - playing games\n     (a) _________________________________________________\n     (b) _________________________________________________", "highlight_kind": "theme", "highlights": ["common causes", "sleep loss", "watching films", "playing games"]}, {"q": "Q5", "type": "Note completion", "original": "5.   The speaker refers to research conducted by Wolfson and Carskadon. Complete the table.\n\n         Percentage of American students              Number of hours of sleep (school night)\n\n                   (a) __________                                    8.5 or more\n\n                        26%                                        (b) __________", "highlight_kind": "theme", "highlights": ["percentage", "hours", "school night"]}, {"q": "Q6", "type": "Multiple choice", "original": "6.   What did Wolfson and Carskadon also find to have a negative influence on adolescent sleep\n     cycles?\n\n     a) At weekends, the average 18-year-old sleeps two hours less.\n     b) At weekends, the average 18-year-old has two extra hours of sleep.\n     c) The average 18-year-old has worse sleep problems at weekends.\n     d) For the average 18-year-old, the amount of sleep at weekends is the same as on a school\n        night.", "highlight_kind": "difference", "highlights": ["two hours less", "two extra hours", "worse sleep problems", "same as"]}, {"q": "Q7", "type": "Multiple choice", "original": "7.   What does the lecturer say about the causes and effects of students’ sleep problems?\n\n     a) There are more effects than causes.\n     b) The causes are more important than the effects.\n     c) The effects are not really problems.\n     d) One effect is particularly serious.", "highlight_kind": "difference", "highlights": ["more effects", "causes are more important", "not really problems", "particularly serious"]}, {"q": "Q8", "type": "Multiple choice", "original": "8.   Which statement below is true?\n\n     Curcio, Ferrera and de Gennaro’s study …\n\n     a) suggested there is no link between sleep and academic performance.\n     b) concluded that a lack of sleep negatively affected academic performance.\n     c) recommended that school children should not be assessed in the mornings.\n     d) was unable to draw any definitive conclusions.", "highlight_kind": "difference", "highlights": ["no link", "negatively affected", "not be assessed", "unable to draw"]}, {"q": "Q9", "type": "Note completion", "original": "9.   The speaker discusses the emotional and behavioural impact of sleep problems in young adults.\n     Complete the notes using no more than three words.\n\n      Effect of lack of sleep on emotions\n\n      Teenage negative emotions - eg: anger __________________ and __________________\n           - emotions can become stronger of (b) ____________________ due to irregular/ lack of\n           sleep\n\n      Other problems: lack of attention, difficulty finishing work, (c) ____________________\n      Dahl’s observation: Behaviour = similar to symptoms of (d) _____________________\n      May have significant effects on (e) ____________________", "highlight_kind": "theme", "highlights": ["emotional and behavioural impact", "negative emotions", "lack of attention", "significant effects"]}, {"q": "Q10", "type": "Note completion", "original": "10. The speaker outlines action that needs to address the problems related to sleep, and what the\n    results would be. Complete the information.\n\n                       Action                                   Result\n     Teachers          Gain understanding of the causes of      Better able to help students\n                       sleep problems through\n                       support from _____________________\n\n     Government                                                 Ensure students learn about causes\n                       (a) ______________________________       of the problem and may be able to\n                                                                find a solution.\n                       _________________________________", "highlight_kind": "theme", "highlights": ["teachers", "government", "action"]}, {"q": "Q11", "type": "Note completion", "original": "11. Complete the following notes about another possible solution, using no more than three words from the lecture for each gap.\n\nSchools → more sleep-friendly, i.e. later school start time\nSome schools (a) __________\nEffects → alertness, (b) __________, academic development and grades\ne.g. Wahlstrom and Freeman, Uni. Minnesota, USA: schools open later = better student (c) __________\nBUT: for schools to start after 9am, need government to change (d) __________\nTo make changes a reality → more (e) __________ and __________ needed.", "highlight_kind": "theme", "highlights": ["possible solution", "later school start time", "Effects", "government"]}, {"q": "Q12", "type": "Multiple choice", "original": "12. In his conclusion, the speaker discusses his opinion of possible school changes. Choose the best description of his attitude.\n\na) totally convinced\nb) very negative\nc) cautious\nd) neutral", "highlight_kind": "difference", "highlights": ["totally convinced", "very negative", "cautious", "neutral"]}, {"q": "Part 3", "type": "Summary / Evaluation", "original": "Summary and Evaluation Task\n\nSummarise: The solutions to the problems associated with sleep deprivation in young adults.\nEvaluate: Which solution do you think would be most effective?", "highlight_kind": "theme", "highlights": ["solutions", "sleep deprivation", "most effective"]}]}, {"id": "t4", "number": 4, "title": "Technology and Law", "audio": "audio/4. Technology and Law.mp3", "transcript": "TOPIC 4: TECHNOLOGY AND LAW\n\n[00:00]\nHello. Today I'd like to talk to you about technology and two of the problems it has created. As we all know, technology advances at a remarkable speed. It is on an exponential curve and touches pretty much everyone on the planet in some way or another. This progression, however, creates problems. It always has done, actually, but as breakthroughs happen more quickly and technology becomes more powerful, the problems I'll discuss with you become more serious. Two of these problems are privacy and safety.\n\nFirstly, I'll describe some historical technological breakthroughs and how the rule of law reacted to these breakthroughs, and then compare that with modern technological advances and the problems the law has in keeping up with these advances.\n\n[01:00]\nThirdly, I'll look at a relatively new problem, that of UAVs, or unmanned aerial vehicles, more commonly known as drones. These have become popular in the last two years or so as toys. Fourthly, I'll consider how law designed to protect our privacy and safety in response to the popularity of drones can actually harm business, research, humanitarian and disaster efforts. Finally, I'd like to suggest that, in many cases, the rush to create laws designed to protect us is perhaps a knee-jerk reaction and is not always necessary.\n\nFirstly, then, a little bit of history, because we like a bit of history. Two examples of how technology has resulted in new laws. Number one: copyright laws were first introduced as a result of the first printing machines.\n\n[02:00]\nPrinting machines allowed texts to be copied more quickly than copying by hand, that is, handwriting the original text. You might be surprised to learn that this happened as far back as the 15th century in Europe. In the UK, the first copyright laws were passed in the early 18th century.\n\nThe second example is the introduction of the railways in the 18th and 19th centuries. This technological progress resulted in new laws for property and employment contracts, and something called eminent domain in the USA or compulsory purchase in the UK, which means that the state has the power to acquire land for public utility even if the current owner of that land does not wish to sell. Obviously, railways take up land belonging to people.\n\n[03:00]\nSo the state had to buy that land in order to build the railways. That actually still happens now. These examples show how the laws governing different countries change as a result of technological advancement.\n\nBack then, we were talking about 300 or more years ago, technology didn't make such great strides in such short periods of time, so it wasn't such a battle for lawmakers to keep up with technology. And, of course, information wasn't so freely available back then. Unless you were directly affected by a new law, you probably didn't even know about it, and even if you did know about it, you probably didn't care if you weren't affected.\n\nThat brings me to my second point. I'd like to draw a parallel with how the law has reacted to technology recently. Many of you, I'm sure, use Twitter.\n\n[04:00]\nIf so, you are one of about 280 million people in the world who do so. Tweeting has led to something called trolling, which basically means writing nasty things to and about other Twitter users because the troll disagrees with the Twitter user or the tweet. Or, perhaps, death threats or threats of physical or sexual violence. These are fairly commonplace nowadays.\n\nAs a result of this troubling phenomenon, new laws are being proposed in the UK which could send the troll to jail for two years. There are existing laws that can be used against trolls, namely the Malicious Communications Act of 1988, the Communications Act of 2003 and the Protection from Harassment Act of 1997.\n\n[05:00]\nNotice that these laws are all from the last thirty years. It makes you wonder if society and people have become more obnoxious in the last thirty years as trolling has become more common. The need has been felt to tighten the existing laws to ensure that convictions against people who say obnoxious things to and about others via social media do actually happen.\n\nIt is all very well to introduce new laws, but the problem, as I mentioned at the start, is that new laws can't keep up with the pace of change in technology. The new anti-trolling laws will come into effect years after trolling became common. Let's now look at another example to highlight the problem: UAVs, or drones. These are small, remote-controlled flying machines, a bit like helicopters, to which you can attach a camera.\n\n[06:00]\nTwo or three years ago, if you said the word drone to me, I would have thought about an unmanned military aircraft that drops bombs on terrorists or innocent civilians. However, in the last two years, as the technology has improved and become substantially cheaper, the price of drones has dropped. You can now buy a half-decent drone for £300, which will fly for about half an hour carrying a video camera.\n\nYou're probably thinking that sounds like fun. I could take it to the park, record a video and upload it to YouTube. Few people would watch it because nothing exciting happened. It might be fun for you, the drone operator or pilot, but other people see only danger. Two dangers specifically: safety and privacy.\n\n[07:00]\nYou see, these drones can fly pretty high and pretty far from where you stand. Therefore, they are potentially dangerous. For example, what if the drone lost power and fell onto someone's head or a moving car? What if you were near an airport and a plane was taking off or landing? Clearly, there is a danger of accidents or even death.\n\nThe second problem is privacy. What if a user flies the drone in front of a neighbour's bedroom window or over a military base? These are issues of privacy and spying, the latter regarding military secrets and the former relating to what we might call stalking, or being a peeping Tom.\n\nIn the UK, the responsibility for creating regulations for the use of drones falls to the CAA, the Civil Aviation Authority.\n\n[08:00]\nIn 2010, it introduced the first regulations on drone use, which had to be updated in 2014 to cover more scenarios. In a nutshell, you cannot fly a drone near any building, vehicle, person or group of people. So, basically, to comply with the law, you need to be in the middle of a large, empty field, and there is not much worth video-recording in a large, empty field.\n\nBesides the problem of keeping the law up to date with technology, there is a second related problem: how to enforce all of these new laws. Can we really expect the police and other authorities to be on the lookout for drone pilots? I'm sure they have more important issues to deal with. A third problem is the impact these laws have on using drones for business, research, disaster and humanitarian reasons.\n\n[09:00]\nIn business, for example, a roof repairer might wish to inspect a roof for damage without using a ladder or scaffolding, thus saving time and money. A biologist may wish to check whether rare birds have laid eggs in a nest in a tree. A news reporter might want to view a conflict zone or natural-disaster zone which is not safe to enter personally.\n\nTo use a drone in these cases requires a licence from the Civil Aviation Authority. In fact, in the last year there has been an 80% increase in the number of licences issued for drone pilots. That's all well and good, but just because the operator has a licence doesn't necessarily mean it is safe for those in the vicinity of the drone.\n\n[10:00]\nSo, what is the solution to the problem of drones, and technological advances in general, if the law cannot keep pace with technology and law enforcement doesn't have the resources to catch those who break the law? It is a difficult one to solve, and I don't have a complete solution, but I would say that 95% of the problems are not actually problems at all.\n\nLet's look at history again to show you what I mean. The invention of the car was a huge step forwards. That's undeniable. However, when cars were first introduced to the roads, a man had to walk in front of them carrying a flag to warn pedestrians of the approaching vehicle. Therefore, the car could only travel at walking speed because of the fear of this new technology. Nowadays, this seems ridiculous.\n\n[11:00]\nAt the age of 17, it is possible to get a licence, pass the driving test and control a machine that kills about 2,000 people every year and injures thousands more in the UK. Based on those statistics, it is surprising that cars are not treated like lethal weapons and banned completely. However, 99% of the people who drive don't injure or kill anyone, ever. Why not? Because they understand that the car can be dangerous and thus they drive carefully.\n\nThe same argument could be made for drones. The vast majority of people understand the dangers and wouldn't use one to spy on their neighbour or use one in close proximity to a large group of people. Basically, people in general take responsibility for their actions. Admittedly, there are, of course, people who do not take responsibility, and this is where my solution probably fails.\n\n[12:00]\nAs we see with car drivers, about a quarter of accidents involve drivers who are driving illegally for a number of reasons: alcohol, drugs, no insurance, and so on. The fact that they have a licence does not stop them from being irresponsible. Similarly, the fact that one has a drone licence does not make the drone safe.\n\nIn conclusion, then, we've seen how technology results in the passing of new laws and regulations to protect our safety and privacy, but we've seen how these laws struggle to keep pace with developments in technology and how the laws can be unhelpful for some people wishing to use the technology legitimately. Also, I've pointed out how the passing of laws does not necessarily mean that our privacy and safety are secure.\n\n[13:00]\nPeople still troll on the Internet even though it is illegal, and people are still killed by drunk drivers even though driving after drinking alcohol is illegal. Now I'd like some ideas from you on this issue. Thank you very much.", "questions": [{"q": "Q1", "type": "Sequencing", "original": "1.   The lecturer outlines the areas his talk will cover. Put these in the right order. Write numbers 1\n     to 5 in the spaces provided.\n\n     a) Describe problems related to the use of drones. _____\n     b) Describe how laws can create problems for different people. _____\n     c) Describe how laws were created in the past in response to new technology. _____\n     d) Describe how the creation of new laws in response to technology may be unnecessary. ____\n     e) Describe recent developments in technology and how laws struggle to keep up. _____", "highlight_kind": "difference", "highlights": ["use of drones", "different people", "in the past", "unnecessary", "struggle to keep up"]}, {"q": "Q2", "type": "Multiple choice", "original": "2.   The lecturer mentions copyright laws as an example of…\n\n     a) how new technology requires a change to existing laws.\n     b) how a new law was introduced due to new technology.\n     c) how the change in law was not inappropriate.\n     d) how laws were developed in the 15th century in the UK.", "highlight_kind": "difference", "highlights": ["change to existing laws", "new law", "not inappropriate", "15th century"]}, {"q": "Q3", "type": "Multiple choice", "original": "3.   Choose the best definition for ‘eminent domain’ or ‘compulsory purchase’ as given by the\n     lecturer.\n\n     a) The power of the state to buy trains for public use.\n     b) The power of individuals to buy land from the state.\n     c) The power of the state to buy land for public use.\n     d) The power of land-owners to sell land to the state.", "highlight_kind": "difference", "highlights": ["state to buy trains", "individuals to buy land", "state to buy land", "land-owners to sell land"]}, {"q": "Q4", "type": "Multiple choice", "original": "4.   The speaker discusses how information was given to the public about new laws. What does he\n     say?\n\n     a) Most people were made aware of new laws.\n     b) Many people didn’t know about new laws.\n     c) No one knew about new laws.\n     d) Everyone was interested in new laws.", "highlight_kind": "difference", "highlights": ["Most people", "Many people", "No one", "Everyone"]}, {"q": "Q5", "type": "Short answer", "original": "5.   Circle the correct word in bold and complete the sentence based on the information given.\n\n     Twitter has had many positive / negative effects, such as… ______________________________\n\n     ______________________________________________________________________________", "highlight_kind": "theme", "highlights": ["positive", "negative", "Twitter", "effects"]}, {"q": "Q6", "type": "Multiple matching", "original": "6.   Match the law with the year it was passed by writing i) – v). Two options are not needed.\n\n         Law                                        Answer              Year\n         The Malicious Communication Act            a)                  i) 1997\n         The Communications Act                     b)                  ii) 1988\n         The Protection from Harassment Act         c)                  iii) 1987\n                                                                        iv) 2003\n                                                                        v) 1993", "highlight_kind": "difference", "highlights": ["Malicious Communication Act", "Communications Act", "Protection from Harassment Act", "2003", "1993"]}, {"q": "Q7", "type": "Multiple choice", "original": "7. The speaker discusses the use of drones. What does he say?\n\n     a) Drones used to be only for military use.\n     b) Most people today have a drone.\n     c) The average cost of a drone is now £600.\n     d) Drone technology is only a few years old.", "highlight_kind": "difference", "highlights": ["only for military use", "Most people today", "£600", "few years old"]}, {"q": "Q8", "type": "Note completion", "original": "8.   The speaker mentions some dangers of flying drones. Complete the notes.\n\n Problem 1: Safety\n\n e.g. Drone loses power. Result: a) ____________________________________________\n\n Drone is flown near an airport. Result: danger of accident\n\n Problem 2: Privacy\n\n e.g. Drones flies - b)__________________________, or c)_______________________", "highlight_kind": "theme", "highlights": ["Safety", "loses power", "airport", "Privacy"]}, {"q": "Q9", "type": "Short answer", "original": "9.   Circle the correct word in bold and complete the sentence based on the information given.\n\n     The regulations introduced by the CAA in 2010 are positive / problematic for members of the\n     public who fly a drone because… _________________________________________________", "highlight_kind": "theme", "highlights": ["CAA", "2010", "positive", "problematic"]}, {"q": "Q10", "type": "Multiple matching", "original": "10. The speaker discusses why new laws may have a negative impact for business, research and\n    humanitarian reasons. Complete the notes with the speaker’s examples.\n\n     Who                                              Reason to use a drone\n     Business                                         a)\n\n     Biologist                                        b)\n\n     News reporter                                  c)", "highlight_kind": "difference", "highlights": ["business", "research", "humanitarian", "Reason to use a drone"]}, {"q": "Q11", "type": "Multiple choice", "original": "11. The speaker discusses the introduction of the motor car and the public’s response to new\n    technology. Which one of the following is true, according to the speaker?\n\n    a) 17 is too young to get a driving licence.\n    b) Cars should be banned as they are dangerous.\n    c) Drivers are generally aware of the dangers and behave accordingly.\n    d) More people are killed by cars than anything else.", "highlight_kind": "difference", "highlights": ["too young", "banned", "aware of the dangers", "more people are killed"]}, {"q": "Part 3", "type": "Summary / Evaluation", "original": "Summary and Evaluation Task\n\nSummarise: The reasons why the law is ineffective at dealing with technological developments.\nEvaluate: To what extent do you agree with the speaker’s point of view?", "highlight_kind": "theme", "highlights": ["law is ineffective", "technological developments", "agree"]}]}, {"id": "t5", "number": 5, "title": "Cloud Computing", "audio": "audio/5. Cloud Computing.mp3", "transcript": "TOPIC 5: CLOUD COMPUTING\n\n[00:00]\nGood morning, everyone. In today's lecture, we are going to think about cloud computing and its application to business: what cloud computing is and how it can be applied by businesses. Let me give you a brief overview of how the lecture will be structured.\n\nWe'll start with a definition of exactly what cloud computing is and what it entails. Then I'll go on to outline the general benefits to users of cloud computing. Next, I'll discuss a case study of how a particular company has started to use the cloud and the benefits that have accrued to it as a result. In addition to this, there will be a couple of other examples of how cloud computing has helped some other businesses. Then we'll examine some of the potential problems of using the cloud.\n\n[01:00]\nFinally, I'll wrap things up by looking at some advice from an expert on how we can make the best use of this new technology.\n\nThe first thing I'm going to do is define exactly what cloud computing is. In the simplest terms, it is IT as a service. This means that, instead of a company building its own IT infrastructure to host databases or software, a third party hosts them on its own large servers, and then your company has access to its own data and software over the Internet. So, cloud computing is when a company, instead of building its own infrastructure, databases or software, asks a third company to do this for it and then accesses its data or software via the Internet.\n\nRight, so what are the benefits of cloud computing?\n\n[02:00]\nThere are five key advantages. The first is that it is cheap. As IT providers host services for multiple companies, sharing this complex infrastructure is cost-efficient. Your company only pays for what it actually uses.\n\nSecondly, it is quick. The most basic cloud services work out of the box: you install them and they work. If you want more complex database and software solutions, then with cloud computing you don't need to buy sophisticated hardware. So, cloud computing is quick.\n\nIn addition, number three, it is up to date. Most providers constantly update their software. They add new features as soon as they become available.\n\n[03:00]\nThe fourth advantage is that cloud computing is adjustable. If a business is growing fast or has seasonal spikes in growth, it can expand its use quickly because cloud systems are built to cope with sharp increases in workload.\n\nFinally, number five, it is mobile. Cloud systems are designed to be used from a distance, so if you have a mobile workforce, your staff will have access to most of your systems wherever they are.\n\nBear in mind that cloud computing is not particularly new. Most of us have been using the cloud already through services such as Hotmail, Flickr and Facebook. It is just business that has been quite slow to adopt it. Now I'm going to talk about an example of a business which recently adopted cloud computing and explain the benefits to this particular company.\n\n[04:00]\nThe company I have in mind is Rentokil. For this worldwide company, email is a key management tool, but as the company has grown, it has found itself with forty different email systems across fifty countries for 20,000 employees. Setting up a single email system with a global server infrastructure would amount to massive capital expenditure. Instead, Rentokil decided on a cloud solution and rolled out Google Enterprise email across the company. It is saving Rentokil about 70% in expenditure and, on top of that, the company is also benefiting from lower support costs.\n\n[05:00]\nSo far, Rentokil has moved about 10,000 staff onto Google's email services and estimates that another 10,000 will have migrated by the end of the year. Google Sites is now being rolled out across Rentokil to create local intranets for the global company and its many divisions. By looking at this example, we can see that cloud computing can be very effective in providing the services that companies need.\n\nTwo more quick examples spring to mind. We have the insurance giant Aviva, which recently moved all its enterprise content-management and business-intelligence tools online using Microsoft's SharePoint Online service.\n\n[06:00]\nAnother example is Universal Music, which is using the cloud-computing services of the e-commerce provider Venda in order to roll out its online-store model across Europe. So Universal Music uses cloud computing provided by Venda to realise its online-store model across the whole continent of Europe.\n\nAs you can see, cloud computing is becoming more and more popular and can be applied nearly anywhere. For instance, a small retailer that needs a secure e-commerce website quickly and cheaply can use cloud computing. Another example is ferry companies, which have huge computing spikes in May, June and July, when most of their customers are using their services.\n\n[07:00]\nFor the rest of the time, their IT system is 90% idle. They can take advantage of cloud computing to expand their services exactly when they need to. Similarly, fire services that need extra computing power to predict the movement of forest fires during the summer can use cloud computing to adjust the way that they use their systems throughout the year.\n\nIt is true that many firms have not significantly moved to cloud computing yet, but it is predicted that more dynamic industries, where business models change very fast and competition is very hard, will move more quickly. Right now, the cloud-computing market is worth almost $2.5 billion, and it is predicted that by 2016 this will have grown to more than $8 billion.\n\n[08:00]\nCompanies should be getting ready now and beginning to map their IT needs. It must be said, however, that cloud computing, as with everything else, does have some problems. What are these problems?\n\nFirst of all, if a company wants to put extra features onto a cloud system in order to cope with some specialised needs, this can be quite expensive to do. Customisation of a cloud system can be quite expensive.\n\nSecondly, there is usability. Employees who are used to using just one type of software are quite often reluctant to switch to different online applications. I speak from personal experience. Even I am one of those people who kicks and screams when something new is introduced, but can then see its benefits.\n\n[09:00]\nFinally, there is connectivity. The city of Los Angeles, as an example, wants to move 34,000 employees to Google Apps, but there have been complaints from these employees about the speed and reliability of this system.\n\nFor me, though, the biggest potential issue with cloud computing is security. Will corporate and customer data be safe? Some experts in business security have said that cloud computing is the concentration of corporate risk in one single place. Experts in favour of cloud computing would refute these arguments, but personally I would say that it is still a big problem for companies which are reluctant to put secure data online, where it could be easily accessed by others.\n\n[10:00]\nSo, cloud computing does have its potential problems. But for every problem there is a solution, and I would say that companies need to do six things before they adopt cloud computing. The ideas I have in mind are based on those put forward by Rowan Trollope, who works at Symantec. He has come up with six tips, six pieces of advice, for companies moving into cloud computing.\n\nThe first is to check out the reputation of the service provider. Secondly, find out how the provider deals with security problems. The third thing is to investigate how the cloud provider makes backup copies of data and how this data could be moved.\n\n[11:00]\nNumber four, companies should work really hard to get a good service-level agreement with clear financial penalties to ensure good service. The cloud provider should be made aware that, if it does not provide a good service, basically it does not get paid.\n\nFifthly, you should be very wary of industry certifications. Don't trust them. Do your own research into how the service provider is performing.\n\nFinally, connected to this, try out the service before you commit. Try it out and see if it works for you. If it doesn't, don't take it. It is easy to switch on and switch off.\n\n[12:00]\nIn my opinion, if, as a company, you take all of these precautions before deciding on a cloud provider, and if after doing this you find a good cloud provider, it will revolutionise your business. To my mind, the growth of cloud computing is absolutely phenomenal at the moment. Cloud computing is just at the start of its evolution, but I predict that, in the very near future, all business computing will be moved into the cloud.\n\nSo, that's the end of today's lecture. Thank you for listening.", "questions": [{"q": "Q1", "type": "Sequencing", "original": "1.   The lecturer outlines the areas his talk will cover. Put these in the right order. Write numbers 1\n     to 5 in the spaces provided.\n\n     a) The most effective way to use cloud computing. ______\n     b) A company which has used cloud computing. ______\n     c) What is involved in cloud computing. ______\n     d) The advantages of cloud computing. ______\n     e) Possible problems with using cloud computing. ______", "highlight_kind": "difference", "highlights": ["most effective way", "A company", "What is involved", "advantages", "Possible problems"]}, {"q": "Q2", "type": "Note completion", "original": "2.   Complete the notes based on the information given.\n\n Benefit                  Reason\n It’s cheap               Company only pays for what it uses.\n It’s quick               Companies can simply install the services and it works ‘out of the box’\n It’s up to date\n                          Providers (a) _________________________________________________\n\n                          - also (b) ________________________________________when available.\n\n It’s adjustable\n                          able to adjust if a business (c)\n                          ____________________________________\n\n                          or has (d) ____________________________________________________\n\n It’s mobile              Cloud services are designed to be used from a distance, so\n\n                          e) _________________________________________________________", "highlight_kind": "theme", "highlights": ["Benefit", "Reason", "up to date", "adjustable", "mobile"]}, {"q": "Q3", "type": "Multiple choice", "original": "3.   The lecturer discusses the company Rentokil. Which one of the following is correct?\n\n     a) The company has grown by 70% in recent years.\n     b) The company relocated around 10,000 staff to a new office.\n     c) The company has offices in 50 countries.\n     d) The company uses managers to coordinate a number of offices.", "highlight_kind": "difference", "highlights": ["grown by 70%", "10,000 staff", "50 countries", "managers"]}, {"q": "Q4", "type": "Multiple matching", "original": "4.   The speaker cites three companies which have used cloud-based services for different reasons.\n     Match the company to the reason by writing i) – v) in the correct space. Two reasons will not be\n     needed.\n\n       Company               Answer                       Uses cloud-based services to…\n       Rentokil                                           i) store and share its business information and\n                                                          tools.\n       Aviva                                              ii) do accounting and transfer money online.\n       Universal Music                                    iii) sell its products online.\n                                                          iv) save money.\n                                                          v) allow its employees to be in contact 24\n                                                          hours a day.", "highlight_kind": "difference", "highlights": ["Rentokil", "Aviva", "Universal Music", "save money", "store and share", "sell its products online"]}, {"q": "Q5", "type": "Multiple choice", "original": "5.   Cloud-based services are of benefit to fire services because…\n\n     a) it provides a more stable system when there more people online.\n     b) many of their IT workers do not work full-time.\n     c) they can run more powerful programmes during the periods they need to.\n     d) they only pay for the power they use.", "highlight_kind": "difference", "highlights": ["stable system", "IT workers", "powerful programmes", "pay for the power"]}, {"q": "Q6", "type": "Short answer", "original": "6.   What are the two reasons given for the prediction that cloud computing will become more\n     popular with some types of industries?\n\n     a) ____________________________________________________________________________\n\n     b) ____________________________________________________________________________", "highlight_kind": "theme", "highlights": ["two reasons", "cloud computing", "prediction", "types of industries"]}, {"q": "Q7", "type": "Multiple choice", "original": "7.   The speaker mentions three problems associated with cloud computing. Which THREE problems\n     are noted?\n\n     a) People have to move location to get reliable connectivity.\n     b) Installing extra features can have a high cost.\n     c) It is not possible to change the system to suit your needs.\n     d) Users may resist a change to different online applications.\n     e) There have been problems about its reliability and speed.\n
