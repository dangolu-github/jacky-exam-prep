 f) Only one type of software is compatible.", "highlight_kind": "difference", "highlights": ["move location", "high cost", "not possible to change", "resist a change", "reliability and speed"]}, {"q": "Q8", "type": "Note completion", "original": "8. The speaker outlines six tips for companies who are moving into cloud computing. Complete the\n   list:\n\n   - check the reputation of the service provider\n   a) _____________________________________________________________________________\n   - find out how the service provider backs up data and how this could be moved\n   - get a good service-level agreement to ensure good service\n   - don’t rely on industry certifications; research how the service provider is performing\n   b) ____________________________________________________________________________", "highlight_kind": "theme", "highlights": ["six tips", "cloud computing", "service provider", "service-level agreement"]}, {"q": "Q9", "type": "Multiple choice", "original": "9. Which statement best describes the speaker’s view of cloud computing in the future?\n    a) cloud computing will decline in the future\n    b) more companies will be concerned about security\n    c) all companies will rely more on web computing\n    d) all companies will become totally web-centric", "highlight_kind": "difference", "highlights": ["decline", "concerned about security", "all companies", "totally web-centric"]}, {"q": "Evaluation", "type": "Summary / Evaluation", "original": "Evaluation Task\n\nIn your opinion, do the benefits of cloud computing outweigh the risks? Use relevant information and examples from the lecture to support your position.", "highlight_kind": "theme", "highlights": ["benefits", "risks", "cloud computing"]}]}], "methods": [{"id": "Sequencing", "cn": "排序题", "en": "Sequencing", "steps": ["把每个选项压成“对象 + 动作”", "先预测 lecture map，再听 first / then / finally", "按原音顺序编号；确认未使用项"], "check": "顺序来自 lecture signposts，不来自选项排列。"}, {"id": "Multiple choice", "cn": "选择题", "en": "Multiple choice", "steps": ["先比较选项中不同的 agent、direction、degree、time", "预测需要听哪类信息", "听完整句；留意 but、however、actually 后的修正"], "check": "听到一个相同词，不代表整个选项正确。"}, {"id": "Short answer", "cn": "简答题", "en": "Short answer", "steps": ["预测 person / place / reason / number / action", "第一遍记内容词，第二遍补单位和限定词", "检查 word limit、拼写、单复数"], "check": "选择并解释题要同时完成选择和原因。"}, {"id": "Summary cloze", "cn": "摘要填空", "en": "Summary cloze", "steps": ["先看 cause / effect 或论证主线", "预测每空词性和答案类别", "按讲座顺序追踪 paraphrase，再检查语法和词数"], "check": "不要只因听到同词就立刻填空。"}, {"id": "Multiple matching", "cn": "多项匹配", "en": "Multiple matching", "steps": ["画 entity 与 feature 两列", "听到新实体就换行", "锁定实体后面的 use / result / view，再连线"], "check": "相邻信息不一定属于同一实体。"}, {"id": "Note completion", "cn": "笔记填空", "en": "Gap-fill / note completion", "steps": ["利用标题、表头、单位预测答案类别", "用结构词定位，再听精确 detail", "数字与单位、cause 与 effect 一起记录"], "check": "比较题要同时核对主体和倍数方向。"}, {"id": "Summary / Evaluation", "cn": "总结与评价", "en": "Summary / Evaluation", "steps": ["Summary 只写讲者 main claims", "按 actor / cause / solution / result 整理笔记", "Evaluation 先定标准，再用 lecture information 支持立场"], "check": "总结和个人评价分开写。"}]};const state={topic:DATA.topics[0]?.id,type:'all',lastFocus:null};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function originalHtml(q){const terms=[...q.highlights].sort((a,b)=>b.length-a.length),pattern=terms.map(reEsc).join('|'),re=new RegExp(`(_{3,}|${pattern})`,'gi'),markClass=q.highlight_kind==='difference'?'difference-mark':'theme-mark';return q.original.split('\n').map((line,lineIndex)=>{let out='',last=0,match;re.lastIndex=0;while((match=re.exec(line))){out+=esc(line.slice(last,match.index));const token=match[0];if(/^_+$/.test(token))out+=`<span class="answer-blank" contenteditable="true" role="textbox" aria-label="${esc(q.q)} 空格"></span>`;else out+=`<span class="hint-mark ${markClass}">${esc(token)}</span>`;last=re.lastIndex}out+=esc(line.slice(last));const option=/^\s*(?:[a-e]|[ivx]+)\)/i.test(line);return `<div class="original-line ${option?'option':''}" data-line="${lineIndex}">${line?out:'&nbsp;'}</div>`}).join('')}
function methodFor(type){return DATA.methods.find(m=>m.id===type)||DATA.methods[0]}
function renderMethods(){$('#methods').innerHTML=DATA.methods.map(m=>`<button class="method" data-method="${esc(m.id)}"><strong>${esc(m.cn)}</strong><small>${esc(m.en)}｜查看提示</small></button>`).join('');document.querySelectorAll('[data-method]').forEach(b=>b.addEventListener('click',()=>openMethod(methodFor(b.dataset.method),b)))}
function renderTabs(){$('#topicTabs').innerHTML=DATA.topics.map(t=>`<button class="topic-tab" data-topic="${t.id}" aria-selected="${t.id===state.topic}">Topic ${t.number}</button>`).join('');document.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{state.topic=b.dataset.topic;renderTabs();renderTopic()}));const types=[...new Set(DATA.topics.flatMap(t=>t.questions.map(q=>q.type)))];$('#typeFilter').innerHTML='<option value="all">全部题型</option>'+types.map(t=>`<option>${esc(t)}</option>`).join('');$('#typeFilter').value=state.type}
function renderTopic(){const t=DATA.topics.find(x=>x.id===state.topic),qs=t.questions.filter(q=>state.type==='all'||q.type===state.type);$('#topicRoot').innerHTML=`<header class="topic-header"><div><div class="badge">Topic ${t.number}</div><div class="topic-title">${esc(t.title)}</div><div class="topic-meta">${t.questions.length} 个题组｜先独立作答，再用 script 核对</div></div><div class="audio-wrap"><audio id="topicAudio" controls preload="metadata" src="${encodeURI(t.audio)}"></audio></div></header><div class="workspace"><section class="questions">${qs.map(q=>`<article class="qcard" data-card="${esc(q.q)}"><div class="qhead"><span><span class="qnum">${esc(q.q)}</span> <span class="qtype">${esc(q.type)}</span></span></div><div class="qbody"><div class="original">${originalHtml(q)}</div><textarea class="scratch" aria-label="${esc(q.q)} 作答草稿" placeholder="作答草稿 / notes"></textarea></div></article>`).join('')}</section><aside class="script-box" aria-label="Topic ${t.number} listening script"><div class="script-head"><strong>Listening script</strong><span>独立滚动｜听后核对</span></div><pre class="script-text">${esc(t.transcript)}</pre></aside></div>`}
function openMethod(m,source) {state.lastFocus=source;$('#drawerBadge').textContent='听题提示';$('#drawerTitle').textContent=`${m.cn}｜${m.en}`;$('#drawerBody').innerHTML=`<ol>${m.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="check"><b>作答前检查</b><br>${esc(m.check)}</div>`;openDrawer()}
function openDrawer(){$('#drawer').classList.add('open');$('#backdrop').classList.add('open');$('#closeDrawer').focus()}function closeDrawer(){$('#drawer').classList.remove('open');$('#backdrop').classList.remove('open');state.lastFocus?.focus()}
$('#typeFilter').addEventListener('change',e=>{state.type=e.target.value;renderTopic()});$('#closeDrawer').addEventListener('click',closeDrawer);$('#backdrop').addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});renderMethods();renderTabs();renderTopic();
</script></body></html>
